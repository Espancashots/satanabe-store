<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Pagamento — Satanabe Store</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="checkout-page">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-emoji">👹</span>
      <span><b>SATANABE</b><small>STORE</small></span>
    </a>
    <a class="top-wa" href="index.html#planos">Voltar</a>
  </header>

  <main class="checkout-wrap">
    <section class="checkout-summary">
      <div class="summary-emoji">🔥</div>
      <span class="eyebrow">SEU PEDIDO</span>
      <h1 id="checkoutPlan">—</h1>
      <div class="checkout-price" id="checkoutPrice">—</div>
      <div class="order-line"><span>Pedido</span><strong id="orderId">—</strong></div>

      <label>Nome <small>(opcional)</small>
        <input id="customerName" type="text" placeholder="Seu nome">
      </label>
      <label>WhatsApp <small>(opcional)</small>
        <input id="customerPhone" type="tel" inputmode="tel" placeholder="(21) 99999-9999">
      </label>
    </section>

    <section id="pixPanel" class="pix-panel">
      <div class="pix-title">
        <div><span class="eyebrow">PAGAMENTO PIX</span><h2>ESCANEIE OU COPIE</h2></div>
        <span class="waiting">AGUARDANDO</span>
      </div>

      <div class="qr-box"><img id="pixQr" alt="QR Code PIX"></div>

      <div class="receiver">
        <span>Recebedor</span>
        <strong>JOAO P M BAPTISTA</strong>
      </div>

      <textarea id="pixCode" readonly rows="3"></textarea>
      <button id="copyPix" class="btn dark full" type="button">COPIAR PIX</button>

      <div class="notice">🔥 Depois de pagar, toque abaixo e envie o comprovante no WhatsApp.</div>
      <button id="paidBtn" class="btn red full big" type="button">JÁ PAGUEI 👺</button>
    </section>

    <section id="freePanel" class="pix-panel hidden">
      <div class="free-monster">👺</div>
      <span class="eyebrow">PLANO GRÁTIS</span>
      <h2>3 HORAS</h2>
      <p>Sem pagamento. Toque abaixo para solicitar pelo WhatsApp.</p>
      <button id="freeBtn" class="btn red full big" type="button">SOLICITAR KEY 🔥</button>
    </section>
  </main>

  <div id="toast" class="toast">PIX copiado</div>
  <script src="app.js?v=3"></script>
</body>
</html>
